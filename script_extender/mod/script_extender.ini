; Victoria II Script Extender for TGC settings (needs The Grand Loader). 1 = on, 0 = off.
; Delete this file to disable the plugin.

; --- Map -------------------------------------------------------------------------------------------

; Infrastructure map mode: click its button again for the next province building (your provinces).
; Blue = highest level your tech allows, blue stripes = can be expanded, red stripes = cannot.
building_map_mode = 1

; --- Buildings -------------------------------------------------------------------------------------

; Ctrl+Shift+click on a province building's Expand: expand it in every province of your country
; that allows it, while the treasury covers the total (Ctrl+click: one state, as in vanilla).
country_upgrade = 1
