; Community Patches settings. Read by mod\community_patch\community_patch.dll; the game never opens it.

; Threads for the engine's TBB scheduler (1-64). 0 = game default.
engine_worker_threads = 4

; Skip a CB type's per-target can_use check for the rest of the day once an attacker-only condition
; failed. AI daily scans only; same results. Off by default: in practice can_use is ~5 ms/day and the
; pre-pass costs about what it saves (docs/cb-cull.md).
cull_cb_checks = 0

; Report CB check counts and times to v2cp.log every 30 game days. Needs cull_cb_checks = 1. Diagnostic.
cull_cb_profiling = 0

; Daily tick profiler: 0 = off, 1 = main blocks, 2 = + calls inside the day tick, 3 = + world market
; and per-country pre-pass, 4 = + per-frame update (UI/render), 5 = + market and Country_DailyUpdate
; internals. Writes a ms/day table to v2cp.log every 30 game days. Diagnostic.
tick_profiler = 0

; Give the AI loop, per country, a decision list without the decisions that cannot pass for it: a
; top-level `tag = X` of another country, a top-level `ai = yes/no` it fails, or a `NOT = { has_*_flag }`
; gate already failed. Rebuilt when a flag is cleared, on load, and every 90 days. Same results, less work.
cull_decision_checks = 1

; Rewrite v2cp_decisions.log every 30 game days with per-day averages for every decision (ms, evaluations,
; skipped). Constant size. Diagnostic.
decision_profiling = 0

; Sampling profiler: every N ms, note where the game thread is (and the calls on its stack) while the
; date advances; rewrites v2cp_samples.tsv every 30 game days. 0 = off, 1 = recommended. Sees virtual
; calls and render, unlike tick_profiler. Map it to functions with tools/scripts/annotate_samples.sh. Diagnostic.
sample_profiler = 0

; Do not block every frame waiting for network packets. The game waits 15-35 ms per frame for them, also
; in single player (a local loopback). 1 = poll without waiting: first year -22 %, same simulation, CPU
; still drops when paused. Multiplayer not tested yet. (re/systems/network.md)
skip_network_wait = 1

; Prefetch the country-to-country relation objects before the three daily scans that read them
; (country recalculation, market capacity, relation purge) and skip purges with nothing to purge.
; Same results. 1 = on. First year 144 -> 137 ms/day. (re/systems/performance.md)
prefetch_relations = 1

; Keep the flag atlases (one per government type, gfx/flags/flagfiles*.tga in the user folder) as DXT1
; instead of uncompressed: 8x less memory per atlas (TGC: 32 -> 4 MB each, 11 atlases). Old caches are
; converted when loaded; delete them once to have them rewritten as DXT1 (faster start). 1 = on.
; Experimental. (re/systems/flags.md)
compress_flag_cache = 0
