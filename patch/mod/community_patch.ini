; Community Patches settings, read by mod\community_patch\community_patch.dll. 1 = on, 0 = off.
; Details of every option: README.md and re/systems/.

; --- Performance -----------------------------------------------------------------------------------

; Poll the network every frame without blocking (vanilla waits 15-35 ms per frame, even in single player).
skip_network_wait = 1

; Give each AI country a decision list without the decisions that cannot pass for it.
cull_decision_checks = 1

; Skip the AI's daily casus belli checks that an attacker-only condition already ruled out.
cull_cb_checks = 0

; Prefetch country-to-country relation data before the three daily scans that read it.
prefetch_relations = 1

; Prefetch pops before two daily per-pop loops (country market update, province pass). Experimental.
prefetch_pops = 0

; Prefetch relation data before each AI country's daily target scan. Experimental.
prefetch_ai_relations = 0

; At max speed, let the daily AI work finish in one frame instead of 20 ms per frame. Experimental.
fast_ai_queue = 0

; With fast_ai_queue, evaluate the AI's daily decision checks on worker threads; 2 = compare only. Experimental.
parallel_decisions = 0

; Threads for the engine's TBB scheduler (1-64); 0 = game default.
engine_worker_threads = 4

; --- Memory ----------------------------------------------------------------------------------------

; Keep the flag atlases compressed (DXT1): ~8x less memory each. Delete old flagfiles* caches once.
compress_flag_cache = 0

; --- Profilers (diagnostics, leave off when playing) -----------------------------------------------

; Daily tick timing table in v2cp.log every 30 days; 1-5 = level of detail.
tick_profiler = 0

; Sample the game thread every N ms into v2cp_samples.tsv (read with tools/scripts/annotate_samples.sh).
sample_profiler = 0

; Per-decision cost table in v2cp_decisions.log every 30 days.
decision_profiling = 0

; CB check counts and times in v2cp.log every 30 days (needs cull_cb_checks = 1).
cull_cb_profiling = 0
