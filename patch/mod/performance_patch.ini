; Victoria II Performance Patch settings, read by mod\performance_patch\performance_patch.dll. 1 = on, 0 = off.
; Requires The Grand Loader (dinput8.dll in the game folder). Each option is explained on the line above it.

; --- Performance -----------------------------------------------------------------------------------

; Poll the network every frame without blocking (vanilla waits 15-35 ms per frame, even in single player).
skip_network_wait = 1

; Give each AI country a decision list without the decisions that cannot pass for it.
cull_decision_checks = 1

; Skip the AI's daily casus belli checks that an attacker-only condition already ruled out.
cull_cb_checks = 1

; Prefetch country-pair data (relations and per-pair arrays) before the four daily scans that read it.
prefetch_relations = 1

; Prefetch pops before three daily per-pop loops (market update, province pass, distribution).
prefetch_pops = 1

; Prefetch relation data before each AI country's daily target scan.
prefetch_ai_relations = 1

; Skip the daily reset of per-country tables that are already clean (mostly countries that no longer exist).
skip_clean_resets = 1

; At max speed, let the daily AI work finish in one frame instead of 20 ms per frame.
fast_ai_queue = 1

; With fast_ai_queue, evaluate the AI's daily decision checks on worker threads; 2 = compare only (shadow mode).
parallel_decisions = 1

; Evaluate the daily event scan's triggers on worker threads; 2 = compare only (shadow mode). Off by default:
; a player reported same-day event chains behaving differently with it on; 2 logs any difference.
parallel_events = 0

; Threads for the engine's TBB scheduler (1-64); 0 = game default.
engine_worker_threads = 4

; Sleep per frame while the render device is lost (a fullscreen game in the background): vanilla 100 ms, which
; leaves a multiplayer client that alt-tabbed out at ten frames a second. 100 = leave the game as it is.
background_sleep_ms = 1

; --- Multiplayer (every player of a game must use the same values) ----------------------------------

; Add a hash of the game state (province owners, country treasuries, pops, the world's RNG position,
; the date) to the daily sync check, so a desync is reported the day it happens instead of days later.
state_checksum = 1

; When the sync check fails, write to the_grand_loader.log which element differed.
oos_log = 1

; When the game detects a sync mismatch, realign the random generator to the host's actual position.
; Vanilla restarts it from the seed, which puts the client out of sync for good after the first mismatch.
fix_rng_resync = 1

; The world's own random generator is seeded from each machine's clock but decides, on every machine,
; when the AI thinks and whether the AI accepts diplomatic actions. Lockstep draws from it are taken
; from the shared, counted generator instead; local-only draws (AI frame jobs, tooltips) from a private one.
sync_world_rng = 1

; The host holds its next tick while any player is more than this many days behind (0 = off). Vanilla lets
; the host run ahead until someone is 6 days behind, then shows "lagging behind" and lowers the speed.
; Suspended while any human-controlled country is at war, so nobody plays a few days behind in a fight.
mp_host_wait_days = 0

; Set the game thread's floating-point control registers to fixed values at every tick (precision below,
; round to nearest, default MXCSR), so Windows, Proton and overlay-altered machines compute the same.
pin_fpu = 1

; With pin_fpu: x87 precision in bits, 24 (what Direct3D leaves on Windows, i.e. vanilla) or 53.
fpu_precision = 24

; --- Crash prevention (vanilla crashes guarded; no effect on a game that would not have crashed) ------

; Opening the production view of a country with a factory whose production type has no local-supply source.
fix_supply_crash = 1

; The technology window with an invention that has no status object (sort comparator and folder icons).
fix_tech_window_crash = 1

; An add_country_modifier, add_province_modifier or remove_*_modifier effect naming a modifier that does not exist:
; the effect does nothing and shows an empty tooltip, the name goes to the_grand_loader.log.
fix_missing_modifier = 1

; The AI's daily scan over a unit standing in a province without an owner (a mod that uncolonises provinces under armies).
fix_missing_state_crash = 1

; --- Memory ----------------------------------------------------------------------------------------

; Keep the flag atlases compressed (DXT1): ~8x less memory each. Delete old flagfiles* caches once.
compress_flag_cache = 1

; --- Profilers (diagnostics, leave off when playing) -----------------------------------------------

; Daily tick timing table in the_grand_loader.log every 30 days; 1-5 = level of detail.
tick_profiler = 0

; Sample the game thread every N ms into performance_patch_samples.tsv (read with docs/tools/scripts/annotate_samples.sh).
sample_profiler = 0

; Per-decision cost table in performance_patch_decisions.log every 30 days.
decision_profiling = 0

; CB check counts and times in the_grand_loader.log every 30 days (needs cull_cb_checks = 1).
cull_cb_profiling = 0

; Multiplayer test aid: a "Force OOS" button over the top-right corner of the game window (windowed or
; borderless; not in exclusive fullscreen) and Ctrl+Shift+O. Makes this machine fail the next sync check.
oos_test_button = 0
