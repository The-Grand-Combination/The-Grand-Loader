; Victoria II Performance Patch settings (needs The Grand Loader). 1 = on, 0 = off.
; Each option is explained above it; details in the patch's docs folder.

; --- Performance -----------------------------------------------------------------------------------

; Poll the network every frame without blocking (vanilla waits 15-35 ms per frame).
skip_network_wait = 1

; Give each AI country a decision list without the decisions that cannot pass for it.
cull_decision_checks = 1

; Skip the AI's daily casus belli checks that an attacker-only condition already ruled out.
cull_cb_checks = 1

; Prefetch country-pair data before the four daily scans that read it.
prefetch_relations = 1

; Prefetch pops before three daily per-pop loops.
prefetch_pops = 1

; Prefetch relation data before each AI country's daily target scan.
prefetch_ai_relations = 1

; Skip the daily reset of per-country tables that are already clean.
skip_clean_resets = 1

; At max speed, finish the daily AI work in one frame instead of 20 ms per frame.
fast_ai_queue = 1

; With fast_ai_queue, check the AI's daily decisions on worker threads. 2 = compare only (shadow mode).
parallel_decisions = 1

; Check the daily event triggers on worker threads. 2 = compare only (shadow mode).
; Off by default: same-day event chains were reported to behave differently with it on.
parallel_events = 0

; Threads for the engine's TBB scheduler (1-64); 0 = game default.
engine_worker_threads = 4

; Sleep per frame while a fullscreen game is in the background (vanilla 100 ms = ten frames a second).
background_sleep_ms = 1

; --- Multiplayer (every player of a game must use the same values) ----------------------------------

; Add a hash of the game state to the daily sync check, so a desync is reported the day it happens.
state_checksum = 1

; When the sync check fails, log which element differed.
oos_log = 1

; On a sync mismatch, realign the random generator to the host's position instead of restarting it.
fix_rng_resync = 1

; Take the lockstep draws of the world's random generator (AI timing, AI acceptance) from the shared one.
sync_world_rng = 1

; The host waits while any player is more than this many days behind (0 = off).
; Suspended while a human-controlled country is at war.
mp_host_wait_days = 0

; A recovered out-of-sync shows a chat line instead of the game's dialog and pause. Needs state_checksum.
oos_notice = 1

; Set the floating-point control registers to fixed values every tick, so all machines compute the same.
pin_fpu = 1

; With pin_fpu: x87 precision in bits, 24 (vanilla on Windows) or 53.
fpu_precision = 24

; --- Crash prevention and Stability ---------------------------------------------------------------

; Production view of a country with a factory whose production type has no local-supply source.
fix_supply_crash = 1

; Technology window with an invention that has no status object.
fix_tech_window_crash = 1

; add/remove_*_modifier with an unknown modifier: no effect, empty tooltip, name logged. A modifier loaded
; later (issues.txt before event_modifiers.txt) is found on first use. Multiplayer: same value for all.
fix_missing_modifier = 1

; AI daily scan over a unit in a province without an owner (mods that uncolonise provinces).
fix_missing_state_crash = 1

; Borderless window at the monitor's size instead of exclusive fullscreen: fast alt-tab, no black screens
; or hangs on return. 0 = use the display settings of the game.
borderless_fullscreen = 1

; Edge-scroll the map only while the cursor is inside the focused game window (not on another monitor).
fix_edge_scroll = 1

; --- Interface -------------------------------------------------------------------------------------

; Ctrl+V types the clipboard text into the focused text field.
clipboard_paste = 1

; Remember the address typed in the multiplayer join dialog for next time.
save_last_ip = 1

; Let the join dialog take address:port (the game always uses port 1638). Only the joining player needs it.
join_port = 1

; Seconds each in-game chat line stays, the "lagging behind" warning included (vanilla: one line per 60 s).
chat_line_seconds = 15

; --- Memory ----------------------------------------------------------------------------------------

; Keep the flag atlases compressed (DXT1, ~8x less memory). Delete old flagfiles* caches once.
compress_flag_cache = 1

; --- Profilers (diagnostics, leave off when playing) -----------------------------------------------

; Daily tick timing table in the_grand_loader.log every 30 days; 1-5 = level of detail.
tick_profiler = 0

; Sample the game thread every N ms into performance_patch_samples.tsv.
sample_profiler = 0

; Per-decision cost table in performance_patch_decisions.log every 30 days.
decision_profiling = 0

; CB check counts and times every 30 days (needs cull_cb_checks = 1).
cull_cb_profiling = 0

; Multiplayer test aid: a "Force OOS" button (windowed or borderless) and Ctrl+Shift+O.
oos_test_button = 0

; Log network connections, disconnections and silences over two seconds.
network_log = 0
