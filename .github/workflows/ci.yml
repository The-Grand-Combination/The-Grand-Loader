name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Configure
        run: cmake --preset x86-release

      - name: Build
        run: cmake --build --preset x86-release

      - name: Package
        run: cmake --install build/x86-release

      - uses: actions/upload-artifact@v4
        with:
          name: Victoria2-Community-Patches
          path: dist/

      - name: Zip release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist/* -DestinationPath "Victoria2-Community-Patches-${{ github.ref_name }}.zip"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: Victoria2-Community-Patches-*.zip
