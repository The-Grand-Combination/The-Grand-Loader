; Victoria II Script Extender for TGC settings (needs The Grand Loader). 1 = on, 0 = off.
; Loaded by a .mod with load = "script_extender/script_extender.dll" (ticked in the launcher).

; --- Map -------------------------------------------------------------------------------------------

; Infrastructure map mode: click its button again for the next province building (your provinces).
; Blue = highest level your tech allows, blue stripes = can be expanded, red stripes = cannot.
building_map_mode = 1

; Political map: substates and puppets are drawn as a shade of their overlord.
; vassal_map_color_own = percent of their own colour in it (0 = the overlord's, 100 = vanilla).
vassal_map_color = 1
vassal_map_color_own = 30

; --- Buildings -------------------------------------------------------------------------------------

; Ctrl+Shift+click on a province building's Expand: expand it in every province of your country
; that allows it, while the treasury covers the total (Ctrl+click: one state, as in vanilla).
country_upgrade = 1

; The AI builds the province buildings listed in the mod's common/buildings_ai.txt (chance, money
; margin, province weight). Fort, naval base and railroad are then found by name, not file order.
buildings_ai = 1
; Diagnostics: log the AI's constructions and a summary every 30 days (costs a scan of all provinces).
buildings_ai_log = 0

; --- Economy -----------------------------------------------------------------------------------

; rich/middle/poor_income_modifier scale what pops of that strata earn, country modifiers too
; (vanilla: province ones only, on artisan input money). Changes results: same value for everyone.
income_modifiers = 1

; --- Wars ------------------------------------------------------------------------------------------

; po_demand_province = yes in a CB of cb_types.txt: like po_demand_state, but the peace takes only
; the war goal's province, and costs only its share of war score. The war-goal dialog lists provinces
; instead of states for such a CB. Needed by mods that use it.
demand_province = 1

; --- Events ----------------------------------------------------------------------------------------

; background = "name" in an event's body: gfx/pictures/events/backgrounds/name.dds (or .tga) becomes
; the background of its window, as picture does for the image. Size it like the window's background.
event_background = 1

; has_province_flag works: the engine never implemented the trigger (it was dropped, so always true).
; set_province_flag and clr_province_flag already worked. Changes results of scripts that use it.
province_flags = 1

; --- Diplomacy -------------------------------------------------------------------------------------

; "Propose Treaty" in the diplomacy view: trade terms (CBs with is_treaty_cb = yes, cb_types.txt)
; and money with a country at peace. treaty_infamy = 1: a term costs its CB's infamy, as a war goal.
treaty = 1
treaty_infamy = 1

; The AI accepts when gain - give + relation + power - reluctance >= 0, in war-score points (peace
; cost of each term). The yesmen console command makes it accept everything. Log: "treaty: AI".
treaty_ai_reluctance = 10
; Percent: what the AI gives counts this much against it (above 100: fair deals get refused).
treaty_ai_give_weight = 150
; Pounds the AI counts as one war-score point (at least 1).
treaty_ai_money_per_point = 1000
; Points at the best relation, minus that at the worst.
treaty_ai_relation = 8
; Percent: worth of a province with its core, when it gets one (core_gain) or gives one (core_give).
treaty_ai_core_gain = 2000
treaty_ai_core_give = 4000
; Points per 100% the proposer is stronger than the AI, counted up to power_cap percent of advantage;
; neighbour = percent of that when the two border each other.
treaty_ai_power = 5
treaty_ai_power_cap = 300
treaty_ai_neighbour = 200
; From coerce_ratio percent of the AI's strength, a bad relation helps the proposer, not the AI
; (hostile = percent of the relation points it then gives).
treaty_ai_coerce_ratio = 300
treaty_ai_hostile = 100
; Percent of value of a gained term for a third country (liberate, release) the AI has no stake in:
; stake = it borders the AI, is in its sphere or is its puppet, or the land holds the AI's cores.
treaty_ai_third_party = 0

; Effects dismantle = TAG (the scope dismantles TAG), dismantled_by = TAG (the reverse), _gw: Great
; War. A forced treaty (after the peace if at war), of these points (at least 1) by the rank of the dismantled.
treaty_dismantle_leader = 300
treaty_dismantle_gp = 250
treaty_dismantle_secondary = 150
treaty_dismantle_other = 100
; Percent (at least 1): the points of dismantle_gw.
treaty_dismantle_gw = 200
; Points past the budget cost infamy: min hundredths for the first, rising towards max (half of the
; way at half points past; min 0-1000, max at least min, half 0-100). The AI goes at most ai_overspend points past.
treaty_dismantle_infamy_min = 10
treaty_dismantle_infamy_max = 100
treaty_dismantle_infamy_half = 50
treaty_dismantle_ai_overspend = 0
; An AI dismantler takes at most this percent of the loser's non-colonial states, and creates at most
; ai_max_new countries in one treaty.
treaty_dismantle_ai_max_states = 35
treaty_dismantle_ai_max_new = 3
; AI dismantler, percent of a land term's value: border = next to the gainer or to land it gets here;
; adjacent = a new country's first state next to land someone else gets; exclave = neither (0 = never).
treaty_dismantle_ai_border = 150
treaty_dismantle_ai_adjacent = 120
treaty_dismantle_ai_exclave = 0
; Percent of the value, to an AI dismantler, of a term whose third country is its ally (allied cores,
; colonies to an ally). Colonies go to allies that are great or secondary powers only.
treaty_dismantle_ai_ally = 130
; Continents (names from map/continent.txt, space separated) where an AI dismantler takes colonies
; only on the coast, or next to one it takes in the same treaty. Empty: anywhere.
treaty_dismantle_ai_coastal_only = europe
; Percent of the value of a colony on the continent of the AI dismantler's capital.
treaty_dismantle_ai_home_continent = 150
; Continents where an AI dismantler prefers land near its own: a land term there is worth 100 + near
; percent at distance 0, falling to far percent at near_range map pixels (map/positions.txt).
treaty_dismantle_ai_near_continents = asia
treaty_dismantle_ai_near = 50
treaty_dismantle_ai_near_range = 1500
treaty_dismantle_ai_far = 50
; Each colony already taken on a near or coastal_only continent scales the next one by this percent.
treaty_dismantle_ai_colony_repeat = 70
; Percent of the value of a term that costs the AI dismantler infamy (land without a claim: cede
; state or province). 0 = never. It never goes over BADBOY_LIMIT with them.
treaty_dismantle_ai_infamy = 40
; Percent of the value of land its gainer lists in common/ai_interests.txt (TAG = { REGION ... }):
; an AI dismantler takes it, or gives an ally its, after cores and before colonies; infamy is paid.
treaty_dismantle_ai_interest = 200
; Percent of the value of land freed to a third country (liberate, free peoples, partition) that
; borders another country or the sea: peoples are freed along the loser's edges, not its middle.
treaty_dismantle_ai_frontier = 150
; Percent of the value of the loser's homeland off the AI dismantler's own continent: only next to
; land it owned before, never through land it gets here (interest and colonies apart). 0 = never.
treaty_dismantle_ai_abroad = 50
; Diagnostics: log every term an AI dismantler picks, with its value and the land rule that set it.
treaty_dismantle_log = 0
